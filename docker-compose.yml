services:
  php:
    build: ./php
    container_name: php
    volumes:
      - ./projects:/var/www/html
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    tty: true
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:10.4.32
    container_name: mariadb
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: test_db
    volumes:
      - ./db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.1
    container_name: phpmyadmin
    restart: always
    ports:
      - 8080:80
    environment:
      PMA_HOST: mariadb
      PMA_USER: root
      PMA_PASSWORD: ""
    depends_on:
      - mariadb
